
<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<title>Gestione attività</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<script th:src="@{/js/theme.js}"></script>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="gestione-attivita">

    <header th:insert="~{fragments/navigation :: block-navigation('Gestione attività')}"></header>
	<div class="page-heading">
		<div class="page-heading-content">

			<div class="page-heading-icon">
				<i class="bi bi-activity"></i>
			</div>

			<div>
				<h1>Gestione Attività</h1>
				<p>Organizza e gestisci le attività della palestra</p>
			</div>

		</div>

		<div class="page-heading-line"></div>
	</div>
	<div class="container-fluid mt-3" align="center">
		<div th:if="${errorMsg}" class="alert alert-danger" style="width: 60%"
			th:text="${errorMsg}"></div>

		<div th:if="${successMsg}" class="alert alert-success"
			style="width: 60%" th:text="${successMsg}"></div>

		<div class="mb-3" style="width:60%; text-align:right">
            <a th:href="@{/admin/createAttivita}"
               class="btn btn-secondary">
                Nuova attività
            </a>
        </div>


		<table class="table table-bordered"
			style="width: 60%; text-align: center">

			<thead>
				<tr>
					<th>Descrizione</th>
					<th>Prezzo</th>
					<th>Elimina</th>
				</tr>
			</thead>

			<tbody>
				<tr th:each="att : ${listAttivita}" th:attr="data-id=${att.id}"
					class="clickable-row" style="cursor: pointer">

					<td th:text="${att.descrizione}"></td>

					<td th:text="|${#numbers.formatDecimal(att.prezzo,1,2)} €|"></td>

					<td class="noselect">

						<form th:action="@{/admin/removeAttivita}" method="post"
							onsubmit="return confirm('Sei sicuro di voler eliminare questa attività?')">

							<input type="hidden" name="id" th:value="${att.id}">

							<button type="submit" class="btn btn-sm btn-delete"
								title="Elimina attività" aria-label="Elimina attività">
								<i class="bi bi-trash3"></i>
							</button>

						</form>

					</td>

				</tr>
			</tbody>

		</table>

	
	</div>
	
	<footer class="site-footer">
		<div class="container-fluid px-4">
			<div class="footer-content">

				<!-- COPYRIGHT -->
				<span class="footer-copyright"> &copy; 2026 Anna Simionato
					S.R.L </span>

				<!-- SOCIAL -->
				<div class="footer-social">
					<i class="bi bi-instagram"></i> <i class="bi bi-linkedin"></i> <i
						class="bi bi-facebook"></i> <i class="bi bi-tiktok"></i>
				</div>
			</div>
		</div>
	</footer>

	<script>
    document.addEventListener("DOMContentLoaded", function() {

        const rows = document.querySelectorAll(".clickable-row");

        rows.forEach(row => {
            row.addEventListener("click", (event) => {

                if (event.target.closest(".noselect"))
                    return;

                const attivitaId = row.getAttribute("data-id");

                if (attivitaId) {
                    window.location.href = `/admin/updateAttivita?id=${attivitaId}`;
                }
            });
        });
    });
</script>
</body>
</html>
