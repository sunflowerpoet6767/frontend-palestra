<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Lista Abbonamenti</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">

<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
	crossorigin="anonymous"></script>

<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script th:src="@{/js/theme.js}"></script>
</head>

<body class="sfondo-geometrico">

	<div id="loading-screen">
		<div class="loading-spinner"></div>
		<div class="loading-text">Caricamento in corso...</div>
	</div>

	<header
		th:insert="~{fragments/navigation :: block-navigation(${titolo})}"></header>
	<div class="page-heading">
		<div class="page-heading-content">

			<div class="page-heading-icon">
				<i class="bi bi-calendar-check"></i>
			</div>

			<div>
				<h1>Gestione Abbonamenti</h1>
				<p>Consulta e aggiorna gli abbonamenti dei soci</p>
			</div>

		</div>

		<div class="page-heading-line"></div>
	</div>
	<div class="container mt-3" align="center">

		<div
			class="card-header d-flex justify-content-between align-items-center mb-3">

			<div>
				<h5 class="mb-0">Dettaglio abbonamento</h5>
			</div>

			<a th:href="@{createAbbonamento(id=${socio.id})}"
				class="btn btn-primary"> Nuovo abbonamento </a>

		</div>

		<table class="table table-bordered mt-2">

			<thead>
				<tr align="center">
					<th>Data iscrizione</th>
					<th>Durata abbonamento</th>
					<th>Attività</th>
				</tr>
			</thead>

			<tbody>

				<tr th:each="abb : ${socio.abbonamento}">

					<td align="center"><a
						th:href="@{removeAbbonamento(abboID=${abb.id}, socioID=${socio.id})}"
						onclick="return confirm('Sei sicuro di volere rimuovere questo abbonamento?')">

							<span
							th:text="${#temporals.format(abb.dataAbbonamento, 'dd/MM/yyyy')}"></span>

					</a></td>

					<td align="center"><span
						th:text="${abb.durataAbbonamento} + ' mesi'"></span></td>

					<td align="center">

						<ul class="list-unstyled mb-0">

							<li th:each="att : ${abb.attivita}" class="mb-2"><a
								th:href="@{removeAbbonamentoAttivita(abboID=${abb.id}, attID=${att.id}, socioID=${socio.id})}"
								onclick="return confirm('Sei sicuro di volere rimuovere questa attività?')">

									<span
									th:text="|${att.descrizione} - ${#numbers.formatDecimal(att.prezzo,1,2)} €|"></span>

							</a></li>

							<li class="mt-3"><a
								th:href="@{aggiungiAttivita(abboID=${abb.id}, socioID=${socio.id})}"
								class="btn btn-primary btn-sm"> Nuova attività </a></li>

						</ul>

					</td>

				</tr>

			</tbody>

		</table>

	</div>
	<script th:src="@{/js/loading.js}" defer></script>
</body>
</html>
