<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" th:href="@{/css/style.css}">
<script th:src="@{/js/theme.js}"></script>
<title>Create Attivita</title>
</head>
<body class="sfondo-geometrico">
	<div id="loading-screen">
		<div class="loading-spinner"></div>
		<div class="loading-text">Caricamento in corso...</div>
	</div>
	<header th:insert="~{fragments/navigation :: block-navigation(${titolo})}"></header>

    <div class="container-fluid mt-2" align="center">
        <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

        <form class="form-content"
      		th:action="${attivita.id == null} ? @{/admin/saveAttivita} : @{/admin/saveUpdateAttivita}"
      		th:object="${attivita}"
      		method="post"
     		style="width: 50%; margin: auto">

            <input type="hidden" th:field="*{id}">

            <table class="table table-secondary m-25">
                <tr>
                    <td><label class="form-label">Descrizione</label></td>
                    <td>
                        <input type="text" th:field="*{descrizione}"
                               placeholder="es. Nuoto" required>
                    </td>
                </tr>
                <tr>
                    <td><label class="form-label">Prezzo</label></td>
                    <td>
                        <input type="number" th:field="*{prezzo}"
                               placeholder="es. 45.00"
                               step="0.01" min="0" required>
                    </td>
                </tr>
            </table>

            <div class="mt-4" align="center">
                <button type="submit"
        			class="btn btn-primary"
       		 		th:text="${attivita.id == null} ? 'Registra attività' : 'Aggiorna attività'">
				</button>
            </div>
        </form>
    </div>
    <script th:src="@{/js/loading.js}" defer></script>
</body>
</html>
