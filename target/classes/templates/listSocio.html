<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" >
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script><title>List Socio</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<script th:src="@{/js/theme.js}"></script>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="gestione-socio">
	<div id="loading-screen">
		<div class="loading-spinner"></div>
		<div class="loading-text">Caricamento in corso...</div>
	</div>
	<header
		th:insert="~{fragments/navigation :: block-navigation('Elenco soci')}"></header>
	<div class="page-heading">

		<div class="page-heading-content">

			<div class="page-heading-icon">
				<i class="bi bi-people-fill"></i>
			</div>

			<div>
				<h1>Gestione Soci</h1>
				<p>Visualizza e gestisci gli iscritti della palestra</p>
			</div>

		</div>

		<div class="page-heading-line"></div>

	</div>
	<div class="container-fluid mt-3" align="center">
		<form th:action="@{listSocio}" th:object="${param}" method="get"
			class="row g-3 align-items-center mb-4"
			style="width: 60%; margin: auto">

			<div class="col-auto">
				<input type="text" name="nome" class="form-control"
					placeholder="Nome" th:value="*{nome}">
			</div>
			<div class="col-auto">
				<input type="text" name="cognome" class="form-control"
					placeholder="Cognome" th:value="*{cognome}">
			</div>
			<div class="col-auto">
				<select class="form-select" th:field="*{attivita}">
					<option value="">Selezione attivita</option>
					<option th:each="att : ${listAttivita}" th:value="${att.id}"
						th:text="${att.descrizione}"></option>
				</select>
			</div>
			<div class="col-auto ms-auto">
				<button type="submit" class="btn btn-primary">Cerca</button>
				<a th:href="@{createSocio}" class="btn btn-secondary">Nuovo
					socio</a>
			</div>
		</form>
		<table class="table table-bordered"
			style="width: 60%; text-align: center">
			<thead>
				<th>Cognome</th>
				<th>Nome</th>
				<th>Email</th>
				<th>Codice fiscale</th>
				<th>Certificato Medico</th>
				<th>Abbonamento</th>
			</thead>

			<tbody>
				<tr th:each="socio : ${listsocio}" th:attr="data-id=${socio.id}"
					class="clickable-row" style="cursor: pointer">
					<td align="center">[[${socio.cognome}]]</td>
					<td align="center">[[${socio.nome}]]</td>
					<td align="center">[[${socio.email}]]</td>
					<td align="center">[[${socio.codiceFiscale}]]</td>
					<td class="noselect"><a
						th:href="@{updateCertificatoMedico(id=${socio.id})}"> <span
							th:text="${socio.certificato} != null ? ${socio.certificato.tipo} : 'senza'"></span>
					</a></td>
					<td class="noselect"><a
						th:href="@{listAbbonamento(id=${socio.id})}"> <span
							th:text="${#lists.size(socio.abbonamento) > 0} ? 'abbonamento attivo' : 'senza abbonamento'"></span>
					</a></td>
				</tr>
			</tbody>


		</table>
	</div>
	<footer class="site-footer">
		<div class="container-fluid px-4">
			<div class="footer-content">

				<!-- COPYRIGHT -->
				<span class="footer-copyright"> &copy; 2026 Anna Simionato
					S.R.L </span>

				<!-- SOCIAL -->
				<div class="footer-social">
					<i class="bi bi-instagram"></i> <i class="bi bi-linkedin"></i> <i
						class="bi bi-facebook"></i> <i class="bi bi-tiktok"></i>
				</div>

			</div>
		</div>
	</footer>

	<script>
		document.addEventListener("DOMContentLoaded", function(){
			const rows = document.querySelectorAll(".clickable-row");
			row.addEventListener("click", (event) => {
				row.addEventListener("click", () => {
					if (event.target.closest(".noselect"))
						return;
					const socioId = row.getAttribute("data-id");
					if (socioId)
						window.location.href = `/updateSocio?id=${socioId}`;
				})
			})
		})
	</script>
	<script th:src="@{/js/loading.js}" defer></script>
</body>
</html>
